<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- Hero Section with Ken Burns Effect -->
    <section class="hero" id="hero">
        <div class="hero-images">
            <div class="hero-image" id="hero-img-1" style="background-image: url('assets/slides/bialetti-slide-1.jpg');"></div>
            <div class="hero-image" id="hero-img-2" style="background-image: url('assets/slides/filter-side-1.jpg');"></div>
            <div class="hero-image" id="hero-img-3" style="background-image: url('assets/slides/turk-1.jpg');"></div>
        </div>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 class="hero-title">La Storia del Caffè</h1>
            <p class="hero-subtitle">Un viaggio attraverso i secoli</p>
        </div>
        <div class="scroll-indicator">
            <span>Scorri per esplorare</span>
            <div class="scroll-arrow"></div>
        </div>
    </section>

    <!-- Main Slides Container -->
    <main class="slides-container" id="slides-container">
        
        <!-- Chapter 1: Bialetti (Vertical) -->
        <section class="chapter" id="chapter-bialetti">
            <div class="slide full-page-slide">
                <img src="assets/slides/bialetti-slide-1.jpg" alt="Moka Bialetti originale" loading="lazy">
            </div>
            <div class="slide full-page-slide">
                <img src="assets/slides/bialetti-slide-2.jpg" alt="Preparazione caffè con Moka" loading="lazy">
            </div>
            <div class="slide full-page-slide">
                <img src="assets/slides/bialetti-side.jpg" alt="Dettaglio Moka Bialetti" loading="lazy">
            </div>
        </section>

        <!-- Chapter 2: Filter (Horizontal) -->
        <section class="chapter horizontal-chapter" id="chapter-filter">
            <div class="horizontal-track">
                <div class="slide horizontal-slide">
                    <img src="assets/slides/filter-side.jpg" alt="Caffè filtro" loading="lazy">
                </div>
                <div class="slide horizontal-slide">
                    <img src="assets/slides/filter-side-1.jpg" alt="Preparazione filtro" loading="lazy">
                </div>
                <div class="slide horizontal-slide">
                    <img src="assets/slides/filter-side-2.jpg" alt="Versamento caffè filtro" loading="lazy">
                </div>
                <div class="slide horizontal-slide">
                    <img src="assets/slides/filter-side-3.jpg" alt="Caffè filtro servito" loading="lazy">
                </div>
            </div>
        </section>

        <!-- Chapter 3: Nespresso (Vertical) -->
        <section class="chapter" id="chapter-nespresso">
            <div class="slide full-page-slide">
                <img src="assets/slides/nespresso-side.jpg" alt="Macchina Nespresso" loading="lazy">
            </div>
            <div class="slide full-page-slide">
                <img src="assets/slides/nespresso-side-1.jpg" alt="Capsule Nespresso" loading="lazy">
            </div>
            <div class="slide full-page-slide">
                <img src="assets/slides/nespresso-side-2.jpg" alt="Espresso Nespresso" loading="lazy">
            </div>
            <div class="slide full-page-slide">
                <img src="assets/slides/nespresso-side-3.jpg" alt="Caffè Nespresso servito" loading="lazy">
            </div>
        </section>

        <!-- Chapter 4: Turkish (Horizontal) -->
        <section class="chapter horizontal-chapter" id="chapter-turkish">
            <div class="horizontal-track">
                <div class="slide horizontal-slide">
                    <img src="assets/slides/turk-1.jpg" alt="Caffè turco tradizionale" loading="lazy">
                </div>
                <div class="slide horizontal-slide">
                    <img src="assets/slides/turk-2.jpg" alt="Preparazione caffè turco" loading="lazy">
                </div>
                <div class="slide horizontal-slide">
                    <img src="assets/slides/turk-3.jpg" alt="Ibrik sul fuoco" loading="lazy">
                </div>
                <div class="slide horizontal-slide" id="last-slide">
                    <img src="assets/slides/turk-4.jpg" alt="Caffè turco servito" loading="lazy">
                </div>
            </div>
        </section>

    </main>

    <!-- Scripts -->
    <script src="js/main.js"></script>
</body>
</html>
