<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Scroll Fade</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="slideshow">
    <!-- Stack all images here, only one is visible at a time -->

    <!-- Turkish -->
    <img src="assets/türk-1.jpg"  alt="Caffè turco tradizionale"
         class="slide-image is-active" data-anim="fade">

    <img src="assets/türk-2.jpg"  alt="Preparazione caffè turco"
         class="slide-image" data-anim="slide-down">

    <img src="assets/türk-3.jpg"  alt="Ibrik sul fuoco"
         class="slide-image" data-anim="fade">

    <img src="assets/türk-4.jpg"  alt="Caffè turco servito"
         class="slide-image" data-anim="slide-down">

    <!-- Filter -->
    <img src="assets/filter-side.jpg"   alt="Caffè filtro"
         class="slide-image" data-anim="fade">

    <img src="assets/filter-side-1.jpg" alt="Preparazione filtro"
         class="slide-image" data-anim="slide-down">

    <img src="assets/filter-side-2.jpg" alt="Versamento caffè filtro"
         class="slide-image" data-anim="fade">

    <img src="assets/filter-side-3.jpg" alt="Caffè filtro servito"
         class="slide-image" data-anim="slide-down">

    <!-- Bialetti -->
    <img src="assets/bialetti-slide-1.jpg" alt="Moka Bialetti originale"
         class="slide-image" data-anim="fade">

    <img src="assets/bialetti-slide-2.jpg" alt="Preparazione caffè con Moka"
         class="slide-image" data-anim="slide-down">

    <img src="assets/bialletti-1-side.jpg" alt="Dettaglio Moka Bialetti"
         class="slide-image" data-anim="fade">

    <!-- Nespresso -->
    <img src="assets/nespresso-side.jpg"   alt="Macchina Nespresso"
         class="slide-image" data-anim="slide-down">

    <img src="assets/nespresso-side-1.jpg" alt="Capsule Nespresso"
         class="slide-image" data-anim="fade">

    <img src="assets/nespresso-side-2.jpg" alt="Espresso Nespresso"
         class="slide-image" data-anim="slide-down">

    <img src="assets/nespresso-side-3.jpg" alt="Caffè Nespresso servito"
         class="slide-image" data-anim="fade">
</main>

<script src="js/main.js"></script>
</body>
</html>
